<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMW Luxe Showcase</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
        }
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: black;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 3px;
            color: #0094ff;
        }
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 40px;
        }
        .card {
            background: #111;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px #00000080;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card .info {
            padding: 20px;
        }
        .card .info h2 {
            margin: 0;
            font-size: 22px;
        }
        .card .info p {
            margin: 5px 0 0;
            color: #ccc;
        }
        /* Popup */
        .popup-bg {
            position: fixed;
            inset: 0;
            background: #000000c4;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            z-index: 2000;
        }
        .popup {
            width: 90%;
            max-width: 900px;
            background: #111;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 40px #000000aa;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .popup img {
            width: 100%;
            border-radius: 15px;
        }
        .popup h2 {
            margin-top: 20px;
            font-size: 26px;
        }
        .popup p {
            color: #ccc;
            line-height: 1.7;
            margin-top: 10px;
        }
        .contact-box {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            background: #0094ff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0276c5;
        }
    </style>
</head>
<body>
    <header>
        <h1>BMW • LUXE SHOWCASE</h1>
    </header>

    <div class="cards-container" id="cards"></div>

    <!-- Popup -->
    <div class="popup-bg" id="popupBg">
        <div class="popup" id="popup">
            <img id="popupImg" />
            <h2 id="popupName"></h2>
            <p id="popupDesc"></p>

            <div class="contact-box">
                <input type="text" placeholder="Your email or phone" id="contactInput" />
                <button onclick="sendContact()">Contact Dealer</button>
            </div>
        </div>
    </div>

    <script>
        const cars = [
            {
                name: "BMW M4 Competition",
                price: "$74,000",
                img: "https://cdn.bmwblog.com/wp-content/uploads/2020/09/2021-bmw-m4-yellow-green-16.jpg",
                desc: "503 horsepower • Twin‑turbo • 0-100 km/h in 3.8s • Pure performance and luxury."
            },
            {
                name: "BMW i8 Roadster",
                price: "$150,000",
                img: "https://cdn.motor1.com/images/mgl/0xM6Z/s3/2019-bmw-i8-roadster.jpg",
                desc: "Hybrid supercar • Futuristic design • Butterfly doors • A true icon on the road."
            },
            {
                name: "BMW X7",
                price: "$99,000",
                img: "https://www.bmwusa.com/content/dam/bmwusa/x7/2023/Overview/2023-bmw-x7-overview-exterior.jpg",
                desc: "Full‑size luxury SUV • 7 seats • V8 power • The ultimate family luxury experience."
            }
        ];

        const cardsContainer = document.getElementById("cards");
        const popupBg = document.getElementById("popupBg");

        cars.forEach(car => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img src="${car.img}" />
                <div class="info">
                    <h2>${car.name}</h2>
                    <p>${car.price}</p>
                </div>
            `;
            card.onclick = () => openPopup(car);
            cardsContainer.appendChild(card);
        });

        function openPopup(car) {
            document.getElementById("popupImg").src = car.img;
            document.getElementById("popupName").innerText = car.name;
            document.getElementById("popupDesc").innerText = car.desc;
            popupBg.style.display = "flex";
        }

        popupBg.onclick = (e) => {
            if (e.target === popupBg) popupBg.style.display = "none";
        };

        function sendContact() {
            const v = document.getElementById("contactInput").value;
            if (!v) return alert("Please enter your contact information.");
            alert("Your request has been sent! The dealer will contact you soon.");
        }
    </script>
</body>
</html>
